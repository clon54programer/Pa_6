# PortoCaribe — DHCP de laboratorio (VM2)
# Se sirve en dummy0 (10.30.50.5/24) y en veth-dhcp (10.30.60.1/24), dos enlaces
# aislados: nunca se escucha en la red real 192.168.100.0/24 para no competir con
# el router del laboratorio.
option domain-name "portocaribe.local";
option domain-name-servers 10.30.50.1;
default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet 10.30.50.0 netmask 255.255.255.0 {
  range 10.30.50.100 10.30.50.150;
  option routers 10.30.50.1;
  option subnet-mask 255.255.255.0;
  option broadcast-address 10.30.50.255;
}

subnet 10.30.60.0 netmask 255.255.255.0 {
  range 10.30.60.100 10.30.60.150;
  option routers 10.30.60.1;
  option subnet-mask 255.255.255.0;
}

# /etc/apache2/sites-available/portal-portocaribe.conf
# Apache publica el portal en :443 y hace proxy al servidor Python en 127.0.0.1:8080.
# Módulos necesarios: ssl proxy proxy_http headers rewrite

<VirtualHost *:80>
    ServerName portal.portocaribe.local
    ServerAdmin atencion@portocaribe.demo

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/portal-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-redirect-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName portal.portocaribe.local
    ServerAdmin atencion@portocaribe.demo

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/portal.crt
    SSLCertificateKeyFile /etc/apache2/ssl/portal.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite        HIGH:!aNULL:!MD5:!3DES

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/ retry=0 timeout=20
    ProxyPassReverse / http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    Header always set Strict-Transport-Security "max-age=15552000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog  ${APACHE_LOG_DIR}/portal-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-access.log combined
</VirtualHost>

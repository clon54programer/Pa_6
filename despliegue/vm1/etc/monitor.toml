# Monitor PortoCaribe — VM1 (192.168.100.60)
#
# Topología del laboratorio (segundo sprint):
#   VM1 192.168.100.60  monitor + Asterisk (SIP 5060, AMI 5038, CDR)
#   VM2 192.168.100.59  portal + PostgreSQL + fail2ban + iptables + DHCP
#
# La recolección SSH trae los snapshots de VM2; el CDR de Asterisk se lee
# localmente porque el monitor corre en la misma máquina.

[general]
zona_horaria = "America/Bogota"
timeout_s = 5
timeout_total_s = 120
reintentos = 2
max_workers = 8
directorio_datos = "/var/lib/portocaribe-monitor/datos"
inventario = "inventario.csv"
retencion_dias = 180
comprimir_dias = 7
intervalo_s = 300
frescura_max_s = 900
version_esquema = 1

[recoleccion]
habilitado = true
usuario = "monitor"
clave = "/etc/monitor/id_ed25519"
known_hosts = "/etc/monitor/known_hosts"
timeout_s = 15
recolectar_antes = true

[recoleccion.vm2]
host = "192.168.100.59"

[salida]
csv = true
jsonl = true
codificacion = "utf-8-sig"

[camaras]
# Sin cámaras en la red del segundo sprint: se habilitará cuando exista la VLAN 30.
habilitado = false
ping_paquetes = 4
rtsp_puerto = 554

[portal]
habilitado = true
url = "https://192.168.100.59/"
timeout_s = 15
umbral_degradado_s = 10.0
verificar_tls = false
estado_apache = "/var/lib/portocaribe-monitor/datos/entradas/vm2/apache.txt"

[base_datos]
habilitado = true
host = "192.168.100.59"
puerto = 5432
base = "portocaribe"
usuario = "monitor"
pgpassfile = "/etc/monitor/pgpass"

[voip]
habilitado = true
host = "127.0.0.1"
sip_puerto = 5060
ami = true
ami_puerto = 5038
ami_usuario = "monitor"
ami_secreto_env = "ASTERISK_AMI_SECRET"
cdr = "/var/log/asterisk/cdr-csv/Master.csv"

[qos]
habilitado = true
servidor_iperf = "192.168.100.59"
duracion_s = 10
ancho_banda = "20M"
interfaz = "enp0s3"

[seguridad]
habilitado = true
modo = "archivo"
entradas = "/var/lib/portocaribe-monitor/datos/entradas/vm2"
iptables_save = "/var/lib/portocaribe-monitor/datos/entradas/vm2/iptables.save"
fail2ban_estado = "/var/lib/portocaribe-monitor/datos/entradas/vm2/fail2ban.txt"
fail2ban_log = "/var/lib/portocaribe-monitor/datos/entradas/vm2/fail2ban.log"
auth_log = "/var/lib/portocaribe-monitor/datos/entradas/vm2/auth.log"
kern_log = "/var/lib/portocaribe-monitor/datos/entradas/vm2/kern.log"
netstat = "/var/lib/portocaribe-monitor/datos/entradas/vm2/netstat.txt"
snmp = "/var/lib/portocaribe-monitor/datos/entradas/vm2/snmp.txt"
prefijos_iptables = ["VLAN30-DROP:", "VLAN40-DROP:"]
jail = "sshd"

[dhcp]
habilitado = true
modo = "archivo"
entradas = "/var/lib/portocaribe-monitor/datos/entradas/vm2"
leases = "/var/lib/portocaribe-monitor/datos/entradas/vm2/dhcpd.leases"
estado = "/var/lib/portocaribe-monitor/datos/entradas/vm2/dhcp_estado.txt"

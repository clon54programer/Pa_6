; PortoCaribe — AMI de Asterisk (solo lectura para el monitor)
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects = no

[monitor]
secret = __AMI_SECRET__
; CoreShowChannels exige la clase de escritura "system"; el usuario es local
; (permit 127.0.0.1) y no puede originar llamadas.
read = call,reporting
write = system
permit = 127.0.0.1/255.255.255.255

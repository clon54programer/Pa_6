; PortoCaribe — transporte SIP de Asterisk (VM1)
; El monitor envía OPTIONS a 127.0.0.1:5060; Asterisk responde 401/200.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Extensión de demostración para las pruebas de llamada (CDR).
[endpoint-1001]
type = endpoint
context = demo
disallow = all
allow = ulaw
auth = auth-1001
aors = 1001

[auth-1001]
type = auth
auth_type = userpass
username = 1001
password = __SIP_SECRET__

[1001]
type = aor
max_contacts = 1

; PortoCaribe — transporte SIP de Asterisk (VM1)
; El monitor envía OPTIONS a 127.0.0.1:5060; Asterisk responde 401/200.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Extensión de demostración para las pruebas de llamada (CDR).
[1001]
type = endpoint
context = demo
disallow = all
allow = ulaw
auth = auth-1001
; El AOR se llama usuario@dominio para que el registrador de Asterisk lo
; encuentre al recibir el REGISTER (find_aor_name prueba usuario@dominio).
aors = 1001@192.168.137.93

[auth-1001]
type = auth
auth_type = userpass
username = 1001
password = __SIP_SECRET__

[1001@192.168.137.93]
type = aor
max_contacts = 1
; Los softphones cambian de puerto al re-registrarse; reemplaza el contacto
; anterior en vez de rechazar el nuevo con 403.
remove_existing = yes

; Segundo usuario SIP para llamar desde otro PC Windows.
[1002]
type = endpoint
context = demo
disallow = all
allow = ulaw
auth = auth-1002
aors = 1002@192.168.137.93

[auth-1002]
type = auth
auth_type = userpass
username = 1002
password = __SIP_SECRET2__

[1002@192.168.137.93]
type = aor
max_contacts = 1
remove_existing = yes

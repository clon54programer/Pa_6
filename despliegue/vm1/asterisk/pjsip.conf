; PortoCaribe — transporte SIP de Asterisk (VM1)
; El monitor envía OPTIONS a 127.0.0.1:5060; Asterisk responde 401/200.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Extensión de demostración para las pruebas de llamada (CDR).
[1001]
type = endpoint
context = demo
disallow = all
allow = ulaw
auth = auth-1001
; El AOR se llama usuario@dominio para que el registrador de Asterisk lo
; encuentre al recibir el REGISTER (find_aor_name prueba usuario@dominio).
aors = 1001@192.168.137.93

[auth-1001]
type = auth
auth_type = userpass
username = 1001
password = __SIP_SECRET__

[1001@192.168.137.93]
type = aor
max_contacts = 1

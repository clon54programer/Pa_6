! =====================================================================
! PortoCaribe — Cisco ASA 5505 como router/firewall de la simulacion
! Aplicado por consola serial (COM3, 9600 8N1) el 2026-11-07
!
! Licencia Base: 3 VLANs, 0 puertos trunk, 10 hosts.
! Por eso solo se enrutan 3 zonas: outside, inside y dmz.
! La VLAN 60 (VoIP, 10.30.60.0/24) NO se enruta en este equipo:
! el ASA no admite IP secundaria ni una cuarta VLAN. Ver README.
! =====================================================================
!
! --- Identidad y acceso --------------------------------------------
hostname ASA-PORTOCARIBE
domain-name portocaribe.local
enable password Porto2026*
clock timezone COT -5
!
! --- VLAN 1: inside (servidores 10.30.50.0/24) ---------------------
interface Vlan1
 nameif inside
 security-level 100
 ip address 10.30.50.1 255.255.255.0
 no shutdown
exit
!
! --- VLAN 2: outside (ISP simulado, DHCP) -------------------------
interface Vlan2
 nameif outside
 security-level 0
 ip address dhcp setroute
 no shutdown
exit
!
! --- VLAN 3: dmz (camaras 10.30.30.0/24) --------------------------
! La licencia Base exige "no forward" en la tercera interfaz.
! Se restringe hacia outside: las camaras no salen a Internet,
! pero inside si puede alcanzarlas (monitor ICMP/RTSP).
interface Vlan3
 no forward interface Vlan2
 nameif dmz
 security-level 50
 ip address 10.30.30.1 255.255.255.0
 no shutdown
exit
!
! --- Asignacion de puertos del switch interno ---------------------
interface Ethernet0/0
 switchport access vlan 2
exit
interface Ethernet0/1
 switchport access vlan 1
exit
interface Ethernet0/2
 switchport access vlan 1
exit
interface Ethernet0/3
 switchport access vlan 1
exit
interface Ethernet0/4
 switchport access vlan 1
exit
interface Ethernet0/5
 switchport access vlan 3
exit
interface Ethernet0/6
 switchport access vlan 3
exit
interface Ethernet0/7
 switchport access vlan 3
exit
!
! --- NAT: PAT de inside (10.30.50.0/24) hacia outside -------------
object network NET-SERVIDORES
 subnet 10.30.50.0 255.255.255.0
exit
nat (inside,outside) source dynamic NET-SERVIDORES interface
!
! --- Inspeccion ICMP (ping del monitor a las camaras) -------------
class-map inspection_default
 match default-inspection-traffic
exit
policy-map global_policy
 class inspection_default
  inspect icmp
 exit
exit
service-policy global_policy global
!
! --- Administracion por SSH desde inside --------------------------
username admin password Porto2026* privilege 15
aaa authentication ssh console LOCAL
crypto key generate rsa modulus 2048
ssh version 2
ssh key-exchange group dh-group14-sha1
ssh 10.30.50.0 255.255.255.0 inside
!
! --- Logging -------------------------------------------------------
logging enable
logging buffered informational
logging buffer-size 16384
logging trap informational
logging timestamp
!
end
write memory

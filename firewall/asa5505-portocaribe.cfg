! =====================================================================
! PortoCaribe — Cisco ASA 5505 como router/firewall de la simulacion
! Aplicado por consola serial (COM3) el 2026-11-07
! Licencia Base: 3 VLANs (inside / outside / dmz), sin trunk 802.1Q
! =====================================================================
! --- Limpieza de la configuracion anterior -------------------------
no route inside 192.168.0.0 255.255.0.0 192.168.7.2 1
no object network obj_any
no http 192.168.1.0 255.255.255.0 inside
no http server enable
no enable password
!
! --- Identidad y acceso --------------------------------------------
hostname ASA-PORTOCARIBE
domain-name portocaribe.local
enable password Porto2026*
clock timezone COT -5
clock set 13:20:00 7 Nov 2026
!
! --- VLAN 1: inside (servidores 10.30.50.0/24 + VoIP 10.30.60.0/24)
interface Vlan1
 nameif inside
 security-level 100
 ip address 10.30.50.1 255.255.255.0
 ip address 10.30.60.1 255.255.255.0 secondary
 no shutdown
exit
!
! --- VLAN 2: outside (ISP simulado, DHCP) --------------------------
interface Vlan2
 nameif outside
 security-level 0
 ip address dhcp setroute
 no shutdown
exit
!
! --- VLAN 3: dmz (camaras 10.30.30.0/24) ---------------------------
interface Vlan3
 nameif dmz
 security-level 50
 ip address 10.30.30.1 255.255.255.0
 no shutdown
exit
!
! --- Asignacion de puertos del switch interno ----------------------
interface Ethernet0/0
 switchport access vlan 2
 no shutdown
exit
interface Ethernet0/1
 switchport access vlan 1
 no shutdown
exit
interface Ethernet0/2
 switchport access vlan 1
 no shutdown
exit
interface Ethernet0/3
 switchport access vlan 1
 no shutdown
exit
interface Ethernet0/4
 switchport access vlan 1
 no shutdown
exit
interface Ethernet0/5
 switchport access vlan 3
 no shutdown
exit
interface Ethernet0/6
 switchport access vlan 3
 no shutdown
exit
interface Ethernet0/7
 switchport access vlan 3
 no shutdown
exit
!
! --- Enrutamiento entre subredes de la misma interfaz (50 <-> 60) --
same-security-traffic permit intra-interface
!
! --- NAT: PAT de inside (servidores y VoIP) hacia outside ----------
object network NET-SERVIDORES
 subnet 10.30.50.0 255.255.255.0
exit
object network NET-VOIP
 subnet 10.30.60.0 255.255.255.0
exit
nat (inside,outside) source dynamic NET-SERVIDORES interface
nat (inside,outside) source dynamic NET-VOIP interface
!
! --- Politica de la DMZ: las camaras no inician trafico ------------
access-list DMZ_IN extended deny ip 10.30.30.0 255.255.255.0 any log warnings
access-list DMZ_IN extended permit ip any any
access-group DMZ_IN in interface dmz
!
! --- Inspeccion ICMP (necesaria para el ping del monitor) ----------
class-map inspection_default
 match default-inspection-traffic
exit
policy-map global_policy
 class inspection_default
  inspect icmp
 exit
exit
service-policy global_policy global
!
! --- Administracion por SSH desde inside ---------------------------
username admin password Porto2026* privilege 15
aaa authentication ssh console LOCAL
crypto key generate rsa modulus 2048
ssh version 2
ssh key-exchange group dh-group14-sha1
ssh 10.30.50.0 255.255.255.0 inside
ssh 10.30.60.0 255.255.255.0 inside
!
! --- Logging -------------------------------------------------------
logging enable
logging buffered 16384
logging trap informational
logging timestamp
!
end
write memory
